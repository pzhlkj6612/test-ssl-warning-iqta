name: Reproduce install-qt-action aqt output parsing

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: macos-15-intel

    steps:
      - name: Create a venv using Apple system Python
        shell: bash
        run: |
          set -euxo pipefail

          # Confirm this is the system interpreter, not the tool-cache Python.
          /usr/bin/python3 --version
          /usr/bin/python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)'

          /usr/bin/python3 -m venv "$RUNNER_TEMP/system-python-venv"

          # GITHUB_PATH affects all later steps, including a `uses:` action step.
          echo "$RUNNER_TEMP/system-python-venv/bin" >> "$GITHUB_PATH"

      - name: Confirm the selected Python
        shell: bash
        run: |
          set -euxo pipefail
          command -v python
          command -v python3
          python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)'

      - name: Run the old action implementation
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb
        with:
          # Do not allow the outer composite action to replace our interpreter.
          setup-python: false

          # This triggers `aqt list-qt ... --latest-version`, whose output
          # is parsed by the old non-/m regex.
          version: "6.9"
          host: mac
          target: desktop
          arch: clang_64
