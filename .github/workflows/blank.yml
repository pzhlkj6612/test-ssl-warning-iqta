name: Reproduce bug when urllib3 v2 outputs warning about LibreSSL 2.8.3
on:
  push:
  workflow_dispatch:
jobs:
  repro:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-26-intel
          - macos-14
          - macos-15
          - macos-26
          - xcode-27
    steps:
      - name: Create venv with Apple system Python
        shell: bash
        run: |
          path="$PWD/system-python-venv"
          /usr/bin/python3 -m venv "$path"
          echo "$path" | tee -a "$GITHUB_PATH"

      - name: Print Python details
        shell: python
        run: |
          import sys
          import ssl
          
          print(sys.executable)
          print(sys.version)
          print(ssl.OPENSSL_VERSION)

      - name: Run the old action implementation
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb  # v4.4.0
        with:
          # Do NOT let "actions/setup-python" download Python with OpenSSL backend.
          setup-python: false
          # For Python 3.9.6 on macOS; https://pypi.org/project/py7zr/1.0.0/ .
          py7zrversion: ==1.0.0
          # "aqt list-qt ..." will still be called.
          extra: --dry-run
